[project]
name = "aci-camera-agent"
version = "0.7.0"
description = "AI Camera Intelligence — Edge Camera Agent (offline-first)"
requires-python = ">=3.12,<3.13"
# Deliberately no dependency on the central server, Redis, Supabase or any cloud service.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "cryptography>=43",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# Optional cloud attribute provider (MVP 04). The agent runs without it; AI person detection
# itself is local (OpenCV DNN + ONNX model) and needs no extra packages.
claude = ["anthropic>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hardware: needs a real local camera (set ACI_TEST_USB_INDEX)",
    "rtsp: needs a real RTSP camera (set ACI_TEST_RTSP_URL)",
    "model: needs the YOLOX ONNX model in ./models",
    "claude_live: calls the real Claude API (costs money; set ACI_TEST_CLAUDE_LIVE=1)",
    "e2e: starts the real central server (apps/api-server) and syncs real agents with it",
]
filterwarnings = ["ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["aci_agent", "tests"]

[tool.ruff.lint.per-file-ignores]
"aci_agent/storage/*.py" = ["E501"]  # long SQL literals
"tests/unit/test_onvif.py" = ["E501"]  # SOAP fixtures
