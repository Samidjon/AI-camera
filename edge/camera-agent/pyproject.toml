[project]
name = "aci-camera-agent"
version = "0.2.0"
description = "AI Camera Intelligence — Edge Camera Agent (offline-first)"
requires-python = ">=3.12,<3.13"
# Deliberately no dependency on the central server, Redis, Supabase or any cloud service.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "cryptography>=43",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hardware: needs a real local camera (set ACI_TEST_USB_INDEX)",
    "rtsp: needs a real RTSP camera (set ACI_TEST_RTSP_URL)",
]
filterwarnings = ["ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["aci_agent", "tests"]

[tool.ruff.lint.per-file-ignores]
"aci_agent/storage/*.py" = ["E501"]  # long SQL literals
"tests/unit/test_onvif.py" = ["E501"]  # SOAP fixtures
