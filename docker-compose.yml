# AI Camera Intelligence — central installation (server side) with Docker Compose.
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production up -d --build
#
# Services: PostgreSQL 16, Redis 7 (optional cache), API server, web dashboard, Caddy (single entry
# point, automatic HTTPS when ACI_SITE_ADDRESS is a domain). Edge agents run next to the cameras
# (systemd / Windows task, see docs/EDGE_AGENT_GUIDE.md) and connect to https://<domain>.
# Only Caddy publishes ports; the database and Redis are reachable on the internal network only.

name: aci

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }   # log rotation

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aci
      POSTGRES_USER: aci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aci -d aci"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    networks: [internal]

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  api:
    <<: *restart
    image: aci-api:${ACI_VERSION:-1.0.0}
    build: ./apps/api-server
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ACI_ENVIRONMENT: production
      ACI_DATABASE_URL: postgresql+psycopg://aci:${POSTGRES_PASSWORD}@postgres:5432/aci
      ACI_REDIS_URL: redis://redis:6379/0
      ACI_JWT_SECRET: ${ACI_JWT_SECRET:?set ACI_JWT_SECRET (python -c "import secrets;print(secrets.token_urlsafe(48))")}
      ACI_CORS_ORIGINS: '["${ACI_PUBLIC_URL:?set ACI_PUBLIC_URL}"]'
      ACI_CORS_ORIGIN_REGEX: ${ACI_CORS_ORIGIN_REGEX:-}
      ACI_PUBLIC_DASHBOARD_URL: ${ACI_PUBLIC_URL}
      ACI_SMTP_HOST: ${ACI_SMTP_HOST:-}
      ACI_SMTP_PORT: ${ACI_SMTP_PORT:-587}
      ACI_SMTP_USERNAME: ${ACI_SMTP_USERNAME:-}
      ACI_SMTP_PASSWORD: ${ACI_SMTP_PASSWORD:-}
      ACI_SMTP_FROM: ${ACI_SMTP_FROM:-}
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  dashboard:
    <<: *restart
    image: aci-dashboard:${ACI_VERSION:-1.0.0}
    build:
      context: ./apps/dashboard
      args:
        NEXT_PUBLIC_API_URL: ${ACI_PUBLIC_URL}
        NEXT_PUBLIC_AGENT_URL: ${ACI_DEFAULT_AGENT_URL:-http://localhost:8100}
    depends_on: [api]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]

  caddy:
    <<: *restart
    image: caddy:2-alpine
    depends_on: [api, dashboard]
    environment:
      ACI_SITE_ADDRESS: ${ACI_SITE_ADDRESS:-:80}
    ports:
      - "${ACI_HTTP_PORT:-80}:80"
      - "${ACI_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
